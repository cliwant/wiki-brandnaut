<!-- @dsCard height=360 -->
<!-- 왼쪽 320px: 시스템 이름과 태그라인(ground). 오른쪽 640×360: 덱의 표지(1장) — 사진 위 워드마크 한 장 그림(Photos/cover-street-walk.png, 1672×941)을 잘리지 않게 맞춰 가운데 둔다. 표지의 제목 자리(워드마크 "Quick Win")가 곧 시스템 이름이다. -->
<div style="position:relative;width:960px;height:360px;overflow:hidden;background:var(--surface);font-family:var(--font-sans)">
  <div style="position:absolute;left:32px;bottom:40px;width:256px">
    <div style="font-size:52px;line-height:.95;font-weight:800;letter-spacing:-1.04px;color:var(--ink)">Quick Win</div>
    <div style="margin-top:14px;font-size:14px;line-height:1.4;font-weight:400;color:var(--gray-600)">브랜드넛 부송동 발표자료의 디자인 언어 — 블루 하나, 니트 3D, 네온 점</div>
  </div>
  <div style="position:absolute;left:320px;top:0;width:640px;height:360px;display:flex;align-items:center;justify-content:center;background:var(--surface)">
    <div class="qw-cover" style="width:640px;height:360px;transform:none">
      <img class="qw-cover__photo" src="../../assets/Photos/cover-street-walk.png" alt="Quick Win 표지: 거리를 걷는 발 위에 흰 워드마크">
    </div>
  </div>
</div>
